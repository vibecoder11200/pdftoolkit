name: pages

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly 100MB matrix pass (phase 6) — never blocks PRs.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Per-event groups: a PR run must never cancel a production deploy or the
  # nightly 100MB matrix mid-flight.
  group: pages-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # F21: the committed manifest must still match HuggingFace (revision,
      # sha256 per file, license ∈ {MIT, Apache-2.0}) before anything builds.
      - run: node scripts/gen-ai-model-manifest.mjs --check
      - run: npm run build
      # Fixtures are gitignored (reproducible) — generate the 1/10MB pair.
      - run: node tests/fixtures/gen.mjs
      # PR gate: engine + 1MB/10MB matrix (phase 6 — 100MB is nightly-only).
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  matrix-100mb:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # pdf-lib holds the whole fixture in heap while generating (plan phase 6:
      # MEMFS ceiling) — lift Node's default 4GB cap for the 100MB build.
      - run: node tests/fixtures/gen.mjs --large
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # PR-tier engine+matrix run (the 100MB describe is a separate FILE now —
      # one vitest process for everything OOM'd the nightly run 4 nights in a
      # row, 2026-10-06..09: all tiers' fixtures went resident at collection
      # and shared the threads-pool heap).
      - run: npx vitest run tests/engine.spec.ts tests/matrix.spec.ts --reporter=default --reporter=json --outputFile=test-results/matrix.json
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      # 100MB tier in its own process: heap lifted to 8GiB (matches the
      # local contract in AGENTS.md §3), file parallelism off so nothing
      # else shares the process.
      - run: npx vitest run tests/matrix-100mb.spec.ts --no-file-parallelism --reporter=default --reporter=json --outputFile=test-results/matrix-100mb.json
        env:
          MATRIX_100MB: '1'
          NODE_OPTIONS: --max-old-space-size=8192
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matrix-100mb-report
          path: test-results/
          if-no-files-found: ignore

  deploy:
    # Production deploys only from main pushes/dispatches — never from PRs.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Enables Pages with the "GitHub Actions" source on first deployment.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deployment
        uses: actions/deploy-pages@v4
