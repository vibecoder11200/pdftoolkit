[package]
name = "pdftoolkit"
version = "0.0.0"
description = "PDF Toolkit — 100% client-side PDF tools (Tauri shell; the app version comes from tauri.conf.json → ../package.json)"
edition = "2021"
rust-version = "1.77"

[lib]
name = "pdftoolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "^2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "^2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "^2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
